<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kijarney</title>

{% include "reusables/home/metadata.html" %}

<link rel="stylesheet" href="/static/css/login.css">
<style>
</style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <img src="/static/images/logo.png" alt="Kijarney Logo" style="width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px;">

        <h2>Kijarney</h2>

        <p>Sign in to continue</p>

    </div>

    <div class="social-login">

        <!-- Connected Google Login Button -->
        <button class="social-btn" onclick="window.location.href='/auth/google/login'">

            <!-- Google -->
            <svg viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.4 39.4 16.1 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.5-6 6.9l6.2 5.2C39.3 36.5 44 30.8 44 24c0-1.3-.1-2.3-.4-3.5z"/>
            </svg>

            Continue with Google

        </button>

        <button class="social-btn" onclick="window.location.href='/coming_soon'">

            <!-- Facebook -->
            <svg viewBox="0 0 24 24">
                <path fill="#1877F2" d="M24 12a12 12 0 10-13.88 11.86v-8.39H7.08V12h3.04V9.41c0-3 1.79-4.66 4.53-4.66 1.31 0 2.68.23 2.68.23v2.96h-1.51c-1.49 0-1.95.92-1.95 1.87V12h3.33l-.53 3.47h-2.8v8.39A12 12 0 0024 12z"/>
            </svg>

            Continue with Facebook

        </button>

        <button class="social-btn" onclick="window.location.href='/home'">

            <!-- Guest Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>

            Login as Guest

        </button>

    </div>

    <div class="divider">
        OR
    </div>

    <!-- Keep IDs unchanged -->

    <input
    id="email"
    type="email"
    placeholder="Email Address">

    <input
    id="password"
    type="password"
    placeholder="Password">

    <button
    class="login-btn"
    onclick="login()">

        Login

    </button>

    <div class="links">

        <a href="/forgot_password">Forgot Password?</a>

        <a href="/register">Create Account</a>

    </div>

    <p id="message"></p>

</div>

<script src="/static/js/login.js"></script>

</body>
</html>
