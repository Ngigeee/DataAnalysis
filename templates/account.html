<!DOCTYPE html>
<html>
<head>

<title>Account & Security</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.section{
margin:25px 0;
padding:20px;
background:#f8fafc;
border-radius:12px;
}

button{

padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;

}

button:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<div class="container">

<h1>
<i class="fas fa-shield-alt"></i>
Account & Security
</h1>

<div class="section">

<h3>Google Account</h3>

<p>Manage your Google sign-in preferences.</p>

<button>Connected</button>

</div>

<div class="section">

<h3>Password</h3>

<p>Update your account password.</p>

<button>Change Password</button>

</div>

<div class="section">

<h3>Email Verification</h3>

<p>Your email verification status.</p>

<button>Verified</button>

</div>

<div class="section">

<h3>Danger Zone</h3>

<p>Permanently delete your account and all stored datasets.</p>

<button style="background:#dc2626">
Delete Account
</button>

</div>

</div>

</body>
</html>
