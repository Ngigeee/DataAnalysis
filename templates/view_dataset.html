<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Dataset - Kijarney</title>
    {% include "reusables/home/metadata.html" %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/view_dataset.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="{{ session.get('user', {}).get('theme', 'light') }}">

<div class="container">

    <div class="topbar">

        <div class="title">

            <i class="fa-solid fa-database"></i>

            <div>
                <h1 id="dataset-name">Loading dataset...</h1>
                <div class="subtitle" id="dataset-status">
                    Loading...
                </div>
            </div>

        </div>

        <div class="actions">

            <a href="{{ url_for('profile') }}"
               class="btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>

            <a id="run-btn"
               class="btn btn-primary">
                <i class="fa-solid fa-play"></i>
                Run Dataset
            </a>

        </div>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-label">Rows</div>
            <div class="stat-value" id="rows">-</div>
        </div>

        <div class="stat">
            <div class="stat-label">Columns</div>
            <div class="stat-value" id="columns">-</div>
        </div>

        <div class="stat">
            <div class="stat-label">File Type</div>
            <div class="stat-value" id="file-type">-</div>
        </div>

        <div class="stat">
            <div class="stat-label">File Size</div>
            <div class="stat-value" id="file-size">-</div>
        </div>

    </div>


    <div class="card">

        <div class="table-wrapper" id="table-wrapper">

            <div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading dataset...</p>
            </div>

        </div>

    </div>

</div>
<script src="{{ url_for('static', filename='js/view_dataset.js') }}"></script>

</body>
</html>
