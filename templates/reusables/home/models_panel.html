<div class="big-overlay" id="model-overlay">
  <div class="big-panel">
    <div class="big-panel-head">
      <h3 id="model-title"><i class="fas fa-robot" style="color:var(--accent)"></i> Train Model</h3>
      <button class="close-btn" onclick="closeModel()"><i class="fas fa-xmark"></i> Close</button>
    </div>
    <div class="big-panel-body">
      <div class="form-row" id="model-form"></div>
      <button class="tb-btn primary" onclick="runModel()"><i class="fas fa-bolt"></i> Train</button>
      <div id="model-result" style="margin-top:16px"></div>
    </div>
  </div>
</div>
