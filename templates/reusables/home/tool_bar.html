<!-- TOOLBAR -->
<div id="datasetToolbar">

    <div class="dataset-name" id="dataset-label">
    </div>

    <div class="toolbar-wrapper">
        <div class="toolbar">

            <button class="tb-btn secondary" onclick="selectAll()">
                <i class="fas fa-check-double"></i> Select All
            </button>

            <button class="tb-btn secondary" onclick="toUpper()">
                <i class="fas fa-font"></i> Uppercase
            </button>

            <button class="tb-btn secondary" onclick="toLower()">
                <i class="fas fa-font"></i> Lowercase
            </button>

            <button class="tb-btn secondary" onclick="addTen()">
                <i class="fas fa-plus"></i> Add 10
            </button>

            <div class="sep"></div>

            <button class="tb-btn secondary" onclick="addColumn()">
                <i class="fas fa-table-columns"></i> Add Column
            </button>

            <button class="tb-btn secondary" onclick="renameColumn()">
                <i class="fas fa-table-columns"></i> Rename Column
            </button>

            <button class="tb-btn secondary" onclick="dropSelectedColumn()">
                <i class="fas fa-minus"></i> Drop Column
            </button>

            <button class="tb-btn secondary" onclick="addRow()">
                <i class="fas fa-plus"></i> Add Row
            </button>

            <button class="tb-btn secondary" onclick="normalizeColumn()">
                <i class="fas fa-sliders"></i> Normalize
            </button>

            <div class="sep"></div>

            <button class="tb-btn secondary" onclick="clearSelection()">
                <i class="fas fa-xmark"></i> Clear Selection
            </button>

        </div>
    </div>

</div>
