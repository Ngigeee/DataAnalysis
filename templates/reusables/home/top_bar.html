<script>
const sidebar = document.getElementById("mobilesidebar");
const overlay = document.querySelector(".mobilesidebar-overlay");

function toggleSidebar(){

    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");

}

// Close sidebar when a button is clicked (mobile)
document.querySelectorAll(".mobilesidebar .s-btn").forEach(btn=>{

    btn.addEventListener("click",()=>{

        if(window.innerWidth<=768){

            sidebar.classList.remove("open");
            overlay.classList.remove("show");

        }

    });

});


//check login status
function toggleUserMenu() {
    const dropdown = document.getElementById("userDropdown");
    if (dropdown) {
        dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    }
}
// =====================================================
// GLOBAL ACTIONS & OVERVIEW
// =====================================================

async function loadOverview() {

    try {

        const response = await fetch("/overview");

        if (!response.ok) {
            throw new Error("Failed to load overview");
        }

        const result = await response.json();

        if (!result.success) {
            throw new Error(
                result.error || "Failed to load overview"
            );
        }

        console.log("Overview:", result);


        // ------------------------------------------
        // DATASET SUMMARY
        // ------------------------------------------

        const rows =
            document.getElementById("overviewRows");

        const columns =
            document.getElementById("overviewColumns");

        const missing =
            document.getElementById("overviewMissing");

        const duplicates =
            document.getElementById("overviewDuplicates");


        if (rows) {
            rows.textContent =
                Number(result.dataset.rows).toLocaleString();
        }

        if (columns) {
            columns.textContent =
                Number(result.dataset.columns).toLocaleString();
        }

        if (missing) {
            missing.textContent =
                Number(
                    result.quality.missing_values
                ).toLocaleString();
        }

        if (duplicates) {
            duplicates.textContent =
                Number(
                    result.quality.duplicate_rows
                ).toLocaleString();
        }


        // ------------------------------------------
        // DATASET NAME
        // ------------------------------------------

        const datasetLabel =
            document.getElementById("dataset-label");

        if (datasetLabel) {

            datasetLabel.textContent =
                result.dataset.name;
        }


        // ------------------------------------------
        // DATA TYPE INFORMATION
        // ------------------------------------------

        const numeric =
            result.column_types?.numeric || 0;

        const categorical =
            result.column_types?.categorical || 0;


        console.log(
            "Numeric columns:",
            numeric
        );

        console.log(
            "Categorical columns:",
            categorical
        );


        // ------------------------------------------
        // COMPLETENESS
        // ------------------------------------------

        console.log(
            "Dataset completeness:",
            result.quality.completeness + "%"
        );


        // ------------------------------------------
        // MEMORY
        // ------------------------------------------

        console.log(
            "Memory:",
            result.memory.mb + " MB"
        );


    } catch (error) {

        console.error(
            "Overview error:",
            error
        );

        toast(
            "Failed to load dataset overview",
            "error"
        );
    }
}

function showGlobalOverview() {

    const workspace = document.getElementById("dataWorkspace");
    const overview = document.getElementById("overviewPanel");
    const toolbar = document.getElementById("datasetToolbar");

    // Hide dataset workspace
    if (workspace) {
        workspace.style.display = "none";
    }

    // Hide dataset toolbar
    if (toolbar) {
        toolbar.style.display = "none";
    }

    // Show overview
    if (overview) {
        overview.style.display = "block";
    }
     loadOverview();
}


function showDatasetWorkspace() {

    const workspace = document.getElementById("dataWorkspace");
    const overview = document.getElementById("overviewPanel");
    const toolbar = document.getElementById("datasetToolbar");

    // Show dataset toolbar
    if (toolbar) {
        toolbar.style.display = "block";
    }

    // Show dataset workspace
    if (workspace) {
        workspace.style.display = "flex";
    }

    // Hide overview
    if (overview) {
        overview.style.display = "none";
    }
}
//show export dropdown menu
function toggleExportMenu() {

    const menu = document.getElementById("exportMenu");

    if (!menu) return;

    menu.classList.toggle("show");
}


// Close export menu when clicking outside
document.addEventListener("click", function(event) {

    const dropdown = document.querySelector(".export-dropdown");
    const menu = document.getElementById("exportMenu");

    if (
        dropdown &&
        menu &&
        !dropdown.contains(event.target)
    ) {
        menu.classList.remove("show");
    }

});
// Close user dropdown when clicking outside of it
window.addEventListener("click", function(event) {
    const container = document.querySelector(".user-menu-container");
    const dropdown = document.getElementById("userDropdown");
    if (container && dropdown && !container.contains(event.target)) {
        dropdown.style.display = "none";
    }
});

//handle models toggling
function handleModelClick(modelType) {

isPremiumUser = true;

if (!isPremiumUser) {
    openPremiumOverlay();
    return;
}

openModelOverlay(modelType);


}


async function openModelOverlay(modelType) {
    const overlay = document.getElementById("modelOverlay");

    // Set the currently selected model
    overlay.dataset.model = modelType;

    console.log("Opening model:", modelType);
    console.log("Overlay model:", overlay.dataset.model);

    // Update title
    document.getElementById("modelTitle").textContent = getModelName(modelType);

    // Clear previous model result
    const resultDiv = document.getElementById("modelResult");
    const resultContent = document.getElementById("modelResultContent");

    if (resultDiv) {
        resultDiv.style.display = "none";
    }

    if (resultContent) {
        resultContent.innerHTML = "";
    }

    // Reset Primary Button state for "Run Model"
    const actionButton = document.querySelector(".model-btn.primary");

    if (actionButton) {
        actionButton.innerHTML = `
            <i class="fas fa-play"></i>
            Run Model
        `;
        actionButton.disabled = false; // <--- FIX 1: Re-enable the button!
        actionButton.onclick = runSelectedModel; // <--- FIX 2: Rebind to the run function!
    }

    // Open overlay
    overlay.classList.add("active");

    // Load fresh dataset/model data
    await loadModelData();
}

function getModelName(modelType) {


const names = {

    linear_regression: "Linear Regression",

    logistic_regression: "Logistic Regression",

    decision_tree: "Decision Tree",

    random_forest: "Random Forest"

};

return names[modelType] || "";


}
