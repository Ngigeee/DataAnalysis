<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kijarney</title>
    {% include "reusables/home/metadata.html" %}
    <link rel="stylesheet" href="/static/css/verify.css">
</head>
<body>

<div class="verify-box">
    <div class="logo">
        <i class="fas fa-shield-halved"></i>
        <h2>Security Verification</h2>
        <p>Enter the 6-digit code sent to your email address</p>
    </div>

    <div class="code-inputs">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric" autofocus>
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
    </div>

    <button class="verify-btn" onclick="verifyCode()">Verify Account</button>

    <div class="links">
        <span>Didn't receive the code?</span>
        <a href="#" onclick="resendCode()">Resend Code</a>
    </div>

    <p id="message"></p>
</div>

<script src="/static/js/verify.js"></script>
</body>
</html>
