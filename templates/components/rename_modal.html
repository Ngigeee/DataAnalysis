<!-- =========================================================
         RENAME MODAL
    ========================================================== -->

    <div
        id="rename-modal"
        class="modal-overlay"
        style="display: none;"
    >

        <div class="card rename-modal">

            <div class="section-header">

                <h3 class="section-title">

                    <i class="fa-solid fa-pen"></i>

                    Rename

                </h3>

                <button
                    type="button"
                    class="btn btn-outline"
                    onclick="closeRenameModal()"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <div style="margin-top: 1rem;">

                <label
                    for="rename-input"
                    style="
                        display: block;
                        margin-bottom: 0.5rem;
                    "
                >
                    New Name
                </label>


                <input
                    type="text"
                    id="rename-input"
                    class="form-control"
                    placeholder="Enter new name"
                >

            </div>


            <div
                style="
                    display: flex;
                    justify-content: flex-end;
                    gap: 0.5rem;
                    margin-top: 1rem;
                "
            >

                <button
                    type="button"
                    class="btn btn-outline"
                    onclick="closeRenameModal()"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="confirmRename()"
                >
                    <i class="fa-solid fa-check"></i>
                    Rename
                </button>

            </div>

        </div>

    </div>
