<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kijarney</title>
    {% include "reusables/home/metadata.html" %}
    <link rel="stylesheet" href="/static/css/verify.css">
</head>
<body>

<div class="verify-box">
    <div class="logo">
        <i class="fas fa-lock-open"></i>
        <h2>New Password</h2>
        <p>Enter the 6-digit code sent to your email and your new password</p>
    </div>

    <div class="code-inputs" style="margin-bottom: 20px;">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric" autofocus>
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
        <input type="text" maxlength="1" class="code-input" pattern="[0-9]*" inputmode="numeric">
    </div>

    <input id="new-password" type="password" placeholder="New Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #d1d5db; border-radius: 8px; box-sizing: border-box; outline: none;">

    <button class="verify-btn" onclick="submitReset()">Reset Password</button>

    <p id="message"></p>
</div>

<script src="/static/js/verify.js"></script>
<script>
// Append handling for password submission alongside the 6-digit inputs logic
function submitReset() {
    let code = "";
    document.querySelectorAll(".code-input").forEach(input => code += input.value);
    const password = document.getElementById("new-password").value;
    const message = document.getElementById("message");

    if (code.length < 6 || !password) {
        message.style.color = "red";
        message.textContent = "Please provide the complete code and a new password.";
        return;
    }

    fetch("/reset_password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = "/login";
        } else {
            message.style.color = "red";
            message.textContent = data.error;
        }
    })
    .catch(err => {
        message.style.color = "red";
        message.textContent = "An error occurred.";
    });
}
</script>
</body>
</html>
